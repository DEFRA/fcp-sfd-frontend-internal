version: 2

# Security updates only. `open-pull-requests-limit: 0` switches off version-update
# PRs; security updates ignore that limit and are grouped into one PR per ecosystem.

updates:
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 0
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 0
    ignore:
      # Ignore entries suppress security updates too, not just version updates.
      #
      # global-agent 4.x gates its TLS options on `configuration.secureEndpoint`,
      # a property Node core never sets on the options passed to `Agent.addRequest`.
      # As a result `servername` is never forwarded to `tls.connect()` when tunnelling
      # HTTPS through the CDP proxy, so Node falls back to verifying the certificate
      # against "localhost" and every outbound HTTPS call (Entra OIDC, DAL token) fails
      # with "Hostname/IP does not match certificate's altnames".
      # Remove this once https://github.com/gajus/global-agent is fixed upstream.
      - dependency-name: "global-agent"
        versions: [">=4.0.0"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
